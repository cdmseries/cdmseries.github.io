<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seriesii</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: radial-gradient(circle at center, rgba(30, 30, 30, 0.4) 0%, rgba(5, 5, 5, 0.95) 100%), url('yeyeyye.png');
            background-size: cover;
            background-position: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 85%;
            max-width: 620px;
            height: 150px;
            background: rgba(22, 22, 22, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 16px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        /* --- TITLE --- */
        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ff0000;
            letter-spacing: -0.5px;
            line-height: 1;
            user-select: none;
            transition: filter 0.2s ease;
        }

        /* --- GLOBAL DISTORTION CLASS --- */
        .distorted {
            filter: url(#tech-wave-filter) !important;
        }

        /* --- LOCATION WITH HOVER TOOLTIP --- */
        .location-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            cursor: pointer;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff0000;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.2px;
            opacity: 0.9;
            transition: filter 0.2s ease;
        }

        .location svg {
            width: 11px;
            height: 11px;
            fill: #ff0000;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8));
        }

        .tooltip-box {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            text-align: center;
        }

        .tooltip-box::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 4px;
            border-style: solid;
            border-color: rgba(15, 15, 15, 0.95) transparent transparent transparent;
        }

        .location-wrapper:hover .tooltip-box {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- FOOTER, VIEWERS & AUDIO CONTROLS --- */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewers {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ff0000;
            font-size: 11px;
            font-weight: 600;
            transition: filter 0.2s ease;
        }

        .red-dot {
            width: 4px;
            height: 4px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 5px #ff0000;
        }

        .eye-icon {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #ff0000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #count {
            margin-left: 2px;
            font-size: 11px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 0, 0, 0.2);
            padding: 3px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease, filter 0.2s ease;
        }

        .audio-player:hover {
            background: rgba(255, 0, 0, 0.12);
            border-color: rgba(255, 0, 0, 0.4);
        }

        .audio-player svg {
            width: 9px;
            height: 9px;
            fill: #ff0000;
        }

        .audio-label {
            font-size: 10px;
            color: #ff0000;
            letter-spacing: 0.5px;
            user-select: none;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- SVG Tech Wave Filter -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
        <filter id="tech-wave-filter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.5" numOctaves="1" result="waveNoise">
                <animate 
                    attributeName="baseFrequency" 
                    dur="0.25s" 
                    values="0.01 0.45; 0.01 0.60; 0.01 0.35; 0.01 0.50" 
                    repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="waveNoise" scale="8" xChannelSelector="R" yChannelSelector="B" />
        </filter>
    </svg>

    <div class="card">
        <div class="center-content">
            <h1 class="title" id="mainTitle">seriesii</h1>
            
            <div class="location-wrapper">
                <div class="location" id="locationText">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    tel aviv
                </div>
                <div class="tooltip-box">
                    Location
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="viewers" id="viewersWrapper">
                <span class="red-dot"></span>
                <svg class="eye-icon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span id="count">0</span>
            </div>

            <div class="audio-player" id="audioToggle">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
                <span class="audio-label" id="audioLabel">play audio</span>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bgAudio" loop preload="auto">
        <source src="dirtymagazines.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Dynamic Live Counter Effect
        let currentCount = 0;
        const countElement = document.getElementById('count');

        function updateViewers() {
            const change = Math.floor(Math.random() * 3) - 1;
            currentCount = Math.max(3, currentCount + change);
            countElement.textContent = currentCount;
            
            const nextCheck = Math.floor(Math.random() * 4000) + 4000;
            setTimeout(updateViewers, nextCheck);
        }

        setTimeout(updateViewers, 4000);

        // Audio Play/Pause Toggle & Distortion State Logic
        const audio = document.getElementById('bgAudio');
        const toggleBtn = document.getElementById('audioToggle');
        const playIcon = document.getElementById('playIcon');
        const audioLabel = document.getElementById('audioLabel');
        const mainTitle = document.getElementById('mainTitle');
        const locationText = document.getElementById('locationText');
        const viewersWrapper = document.getElementById('viewersWrapper');
        
        let isPlaying = false;

        toggleBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    audioLabel.textContent = "pause audio";
                    playIcon.innerHTML = '<rect x="6" y="4" width="3" height="16"></rect><rect x="15" y="4" width="3" height="16"></rect>';
                    
                    // Apply distortion filter to title, location, viewer tag, and button
                    mainTitle.classList.add('distorted');
                    locationText.classList.add('distorted');
                    viewersWrapper.classList.add('distorted');
                    toggleBtn.classList.add('distorted');
                }).catch(e => {
                    console.error("Playback failed:", e);
                    alert("Unable to play audio. Ensure 'dirtymagazines.mp3' is uploaded in your repository root.");
                });
            } else {
                audio.pause();
                isPlaying = false;
                audioLabel.textContent = "play audio";
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"></polygon>';
                
                // Remove distortion filter from all elements
                mainTitle.classList.remove('distorted');
                locationText.classList.remove('distorted');
                viewersWrapper.classList.remove('distorted');
                toggleBtn.classList.remove('distorted');
            }
        });
    </script>
</body>
</html>
