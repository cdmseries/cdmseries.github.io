<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seriesii</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: radial-gradient(circle at center, rgba(30, 30, 30, 0.4) 0%, rgba(5, 5, 5, 0.95) 100%), url('yeyeyye.png');
            background-size: cover;
            background-position: center;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 520px;
            height: 220px;
            background: rgba(22, 22, 22, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        /* --- HARDWARE DISTORTION / GLITCH EFFECT --- */
        .title {
            font-family: 'VT323', monospace;
            font-size: 46px;
            color: #ff1a1a;
            letter-spacing: -1px;
            line-height: 1;
            user-select: none;
            position: relative;
            display: inline-block;
        }

        /* Duplicate layer 1 (Cyan offset slice) */
        .title::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #00ffff;
            opacity: 0.75;
            clip-path: inset(40% 0 35% 0);
            animation: glitch-slice-1 2.5s infinite linear alternate-reverse;
            pointer-events: none;
        }

        /* Duplicate layer 2 (Red displacement slice) */
        .title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ff0044;
            opacity: 0.75;
            clip-path: inset(10% 0 75% 0);
            animation: glitch-slice-2 2s infinite linear alternate-reverse;
            pointer-events: none;
        }

        @keyframes glitch-slice-1 {
            0% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
            10% { clip-path: inset(80% 0 5% 0); transform: translate(3px, 0); }
            20% { clip-path: inset(40% 0 40% 0); transform: translate(0, 0); }
            30% { clip-path: inset(0% 0 95% 0); transform: translate(-2px, 0); }
            40% { clip-path: inset(50% 0 30% 0); transform: translate(2px, 0); }
            50% { clip-path: inset(10% 0 85% 0); transform: translate(0, 0); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(-1px, 0); }
        }

        @keyframes glitch-slice-2 {
            0% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 0); }
            15% { clip-path: inset(15% 0 70% 0); transform: translate(-3px, 0); }
            30% { clip-path: inset(45% 0 45% 0); transform: translate(0, 0); }
            45% { clip-path: inset(90% 0 5% 0); transform: translate(3px, 0); }
            60% { clip-path: inset(30% 0 55% 0); transform: translate(-1px, 0); }
            100% { clip-path: inset(5% 0 85% 0); transform: translate(1px, 0); }
        }

        /* --- LOCATION WITH HOVER TOOLTIP --- */
        .location-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 14px;
            cursor: pointer;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff1a1a;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .location svg {
            width: 10px;
            height: 10px;
            fill: #ff1a1a;
        }

        .tooltip-box {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 26, 26, 0.4);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            text-align: center;
        }

        .tooltip-box::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 15, 15, 0.95) transparent transparent transparent;
        }

        .location-wrapper:hover .tooltip-box {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- FOOTER & AUDIO CONTROLS --- */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewers {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff1a1a;
            font-size: 12px;
            font-weight: 600;
        }

        .red-dot {
            width: 5px;
            height: 5px;
            background-color: #ff1a1a;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff1a1a;
        }

        .eye-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #ff1a1a;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #count {
            margin-left: 2px;
            font-size: 13px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .audio-player:hover {
            background: rgba(255, 26, 26, 0.15);
            border-color: rgba(255, 26, 26, 0.3);
        }

        .audio-player svg {
            width: 12px;
            height: 12px;
            fill: #ff1a1a;
        }

        .audio-label {
            font-size: 10px;
            color: #aaa;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="center-content">
            <!-- Notice data-text attribute added here for the CSS distortion effect -->
            <h1 class="title" data-text="seriesii">seriesii</h1>
            
            <div class="location-wrapper">
                <div class="location">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    tel aviv
                </div>
                <div class="tooltip-box">
                    Live Broadcast Node // TLV-01
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="viewers">
                <span class="red-dot"></span>
                <svg class="eye-icon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span id="count">0</span>
            </div>

            <div class="audio-player" id="audioToggle">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
                <span class="audio-label" id="audioLabel">play audio</span>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bgAudio" loop preload="auto">
        <source src="dirtymagazines.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Dynamic Live Counter Effect
        let currentCount = 0;
        const countElement = document.getElementById('count');

        function updateViewers() {
            const change = Math.floor(Math.random() * 3) - 1;
            currentCount = Math.max(3, currentCount + change);
            countElement.textContent = currentCount;
            
            const nextCheck = Math.floor(Math.random() * 4000) + 4000;
            setTimeout(updateViewers, nextCheck);
        }

        setTimeout(updateViewers, 4000);

        // Audio Play/Pause Toggle Logic
        const audio = document.getElementById('bgAudio');
        const toggleBtn = document.getElementById('audioToggle');
        const playIcon = document.getElementById('playIcon');
        const audioLabel = document.getElementById('audioLabel');
        
        let isPlaying = false;

        toggleBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    audioLabel.textContent = "pause audio";
                    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                }).catch(e => {
                    console.error("Playback failed:", e);
                    alert("Unable to play audio. Ensure 'dirtymagazines.mp3' is uploaded in your repository root.");
                });
            } else {
                audio.pause();
                isPlaying = false;
                audioLabel.textContent = "play audio";
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"></polygon>';
            }
        });
    </script>
</body>
</html>
