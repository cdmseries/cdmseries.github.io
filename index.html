<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seriesii</title>
    <!-- Imported Silkscreen for pixel title and Inter for clean location text -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: radial-gradient(circle at center, rgba(30, 30, 30, 0.4) 0%, rgba(5, 5, 5, 0.95) 100%), url('yeyeyye.png');
            background-size: cover;
            background-position: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 520px;
            height: 220px;
            background: rgba(22, 22, 22, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        /* --- HIGH FREQUENCY WAVE DISTORTION TITLE --- */
        .title {
            font-family: 'Silkscreen', monospace;
            font-size: 38px;
            font-weight: 700;
            color: #ff0000;
            letter-spacing: -1.5px;
            line-height: 1;
            user-select: none;
            /* Applies the dynamic SVG high-frequency turbulence wave */
            filter: url(#wave-distortion);
            /* Small continuous jitter animation */
            animation: micro-jitter 0.15s infinite alternate;
        }

        @keyframes micro-jitter {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-0.5px, 0.5px); }
            100% { transform: translate(0.5px, -0.5px); }
        }

        /* --- LOCATION WITH HOVER TOOLTIP & RED GLOW --- */
        .location-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 18px;
            cursor: pointer;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff0000;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.2px;
            opacity: 0.95;
        }

        .location svg {
            width: 16px;
            height: 16px;
            fill: #ff0000;
            /* Soft red halo glow on the pin */
            filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.8));
        }

        .tooltip-box {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            text-align: center;
        }

        .tooltip-box::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 15, 15, 0.95) transparent transparent transparent;
        }

        .location-wrapper:hover .tooltip-box {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- FOOTER & AUDIO CONTROLS --- */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewers {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff0000;
            font-size: 12px;
            font-weight: 600;
        }

        .red-dot {
            width: 5px;
            height: 5px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff0000;
        }

        .eye-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #ff0000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #count {
            margin-left: 2px;
            font-size: 13px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .audio-player:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.3);
        }

        .audio-player svg {
            width: 12px;
            height: 12px;
            fill: #ff0000;
        }

        .audio-label {
            font-size: 10px;
            color: #aaa;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- SVG Displacement Filter for High-Frequency Horizontal Distortion -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
        <filter id="wave-distortion">
            <!-- baseFrequency controls wave density (X=0.01 Y=0.35 gives high horizontal ripple frequency) -->
            <!-- numOctaves increases noise detail -->
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.35" numOctaves="2" result="noise">
                <animate attributeName="baseFrequency" dur="0.2s" values="0.01 0.35;0.01 0.45;0.01 0.30;0.01 0.35" repeatCount="indefinite" />
            </feTurbulence>
            <!-- scale controls the wave amplitude distortion -->
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="card">
        <div class="center-content">
            <h1 class="title">seriesii</h1>
            
            <div class="location-wrapper">
                <div class="location">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    tel aviv
                </div>
                <div class="tooltip-box">
                    Live Broadcast Node // TLV-01
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="viewers">
                <span class="red-dot"></span>
                <svg class="eye-icon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span id="count">0</span>
            </div>

            <div class="audio-player" id="audioToggle">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
                <span class="audio-label" id="audioLabel">play audio</span>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bgAudio" loop preload="auto">
        <source src="dirtymagazines.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Dynamic Live Counter Effect
        let currentCount = 0;
        const countElement = document.getElementById('count');

        function updateViewers() {
            const change = Math.floor(Math.random() * 3) - 1;
            currentCount = Math.max(3, currentCount + change);
            countElement.textContent = currentCount;
            
            const nextCheck = Math.floor(Math.random() * 4000) + 4000;
            setTimeout(updateViewers, nextCheck);
        }

        setTimeout(updateViewers, 4000);

        // Audio Play/Pause Toggle Logic
        const audio = document.getElementById('bgAudio');
        const toggleBtn = document.getElementById('audioToggle');
        const playIcon = document.getElementById('playIcon');
        const audioLabel = document.getElementById('audioLabel');
        
        let isPlaying = false;

        toggleBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    audioLabel.textContent = "pause audio";
                    playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                }).catch(e => {
                    console.error("Playback failed:", e);
                    alert("Unable to play audio. Ensure 'dirtymagazines.mp3' is uploaded in your repository root.");
                });
            } else {
                audio.pause();
                isPlaying = false;
                audioLabel.textContent = "play audio";
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"></polygon>';
            }
        });
    </script>
</body>
</html>
