<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seriesii</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: radial-gradient(circle at center, rgba(30, 30, 30, 0.4) 0%, rgba(5, 5, 5, 0.95) 100%), url('yeyeyye.png');
            background-size: cover;
            background-position: center;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 520px;
            height: 220px;
            background: rgba(22, 22, 22, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        /* --- GLITCH / TV EFFECT --- */
        .title {
            font-family: 'VT323', monospace;
            font-size: 46px;
            color: #ff1a1a;
            letter-spacing: -1px;
            line-height: 1;
            user-select: none;
            position: relative;
            animation: glitch-anim 3s infinite steps(1);
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px); text-shadow: 2px 0 #00ffcc, -2px 0 #ff0055; }
            21% { transform: translate(0) }
            60% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, 2px); text-shadow: -2px -2px #00ffcc, 2px 2px #ff0055; }
            76% { transform: translate(0); text-shadow: none; }
            100% { transform: translate(0) }
        }

        /* --- LOCATION WITH HOVER TOOLTIP --- */
        .location-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 14px;
            cursor: pointer;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff1a1a;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .location svg {
            width: 10px;
            height: 10px;
            fill: #ff1a1a;
        }

        .tooltip-box {
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 26, 26, 0.4);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            text-align: center;
        }

        .tooltip-box::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(15, 15, 15, 0.95) transparent transparent transparent;
        }

        .location-wrapper:hover .tooltip-box {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* --- FOOTER & AUDIO CONTROLS --- */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewers {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff1a1a;
            font-size: 12px;
            font-weight: 600;
        }

        .red-dot {
            width: 5px;
            height: 5px;
            background-color: #ff1a1a;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff1a1a;
        }

        .eye-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #ff1a1a;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #count {
            margin-left: 2px;
            font-size: 13px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
